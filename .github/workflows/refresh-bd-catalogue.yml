name: Refresh BD catalogue

on:
  schedule:
    - cron: '0 3 * * 1'   # Every Monday at 03:00 UTC
  workflow_dispatch:        # Manual trigger via GitHub UI

jobs:
  refresh:
    name: Rebuild assets/bd-catalogue.json from Wikidata
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build BD catalogue
        run: node scripts/build-bd-catalogue.mjs

      - name: Commit updated catalogue
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/bd-catalogue.json
          git diff --staged --quiet && echo "No changes" || (
            git commit -m "chore: refresh BD catalogue $(date +%Y-%m-%d) [skip ci]" &&
            git push
          )
