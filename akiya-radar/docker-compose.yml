services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-akiya_radar}
      POSTGRES_USER: ${POSTGRES_USER:-akiya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-akiya_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - akiya_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-akiya} -d ${POSTGRES_DB:-akiya_radar}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-akiya}:${POSTGRES_PASSWORD:-akiya_dev_password}@postgres:5432/${POSTGRES_DB:-akiya_radar}
      APP_ENV: ${APP_ENV:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      BACKEND_PORT: "8000"
      SEED_ON_START: ${SEED_ON_START:-true}
      EXCHANGE_RATE_PROVIDER: ${EXCHANGE_RATE_PROVIDER:-mock}
      TRANSLATION_PROVIDER: ${TRANSLATION_PROVIDER:-mock}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-akiya_admin_dev}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  worker:
    build: ./worker
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-akiya}:${POSTGRES_PASSWORD:-akiya_dev_password}@postgres:5432/${POSTGRES_DB:-akiya_radar}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      VITE_API_PROXY: http://backend:8000
      FRONTEND_PORT: "5173"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"

volumes:
  akiya_pgdata:
